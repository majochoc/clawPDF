[shop]
name = HRM Automotive
phone = (703) 866-0602

[email]
subject_template = {document_type} #{ro_number} - {shop_name}
body_template =
    Dear {customer_first_name},

    Please find attached your {document_type_lower} #{ro_number} for your {vehicle}.

    Total: {total}

    If you have any questions, please contact us at {shop_phone}.

    Thank you for your business,
    {shop_name}

[thunderbird]
# Leave blank to auto-detect from standard install paths
path =

[api]
# BaySense API for fallback lookups (future use)
base_url = http://192.168.1.100:3000/api/v1
enabled = false

[logging]
file = baysense_email.log
level = Info
